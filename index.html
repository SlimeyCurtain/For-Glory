<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>For Glory</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="game-container"></div>
      <div id="ui-root"></div>
    </div>
    <div id="rotate-overlay">
      <div id="rotate-message">Rotate your device to landscape to play</div>
    </div>

    <div id="title-screen">
      <div id="title-art" aria-hidden="true">
        <svg viewBox="0 0 400 240" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1b2a3d" />
              <stop offset="100%" stop-color="#2f4a3a" />
            </linearGradient>
          </defs>
          <rect x="0" y="0" width="400" height="240" fill="url(#sky)" />
          <g opacity="0.9">
            <polygon points="0,150 40,130 80,155 120,125 160,150 200,120 240,150 280,128 320,152 360,124 400,148 400,240 0,240" fill="#3a5a3f" />
            <polygon points="0,175 60,158 130,178 190,150 260,176 330,152 400,172 400,240 0,240" fill="#31502f" />
          </g>
          <g stroke="#22331f" stroke-width="1" opacity="0.35">
            <polygon points="150,150 175,135 200,150 200,175 175,190 150,175" fill="none" />
            <polygon points="200,150 225,135 250,150 250,175 225,190 200,175" fill="none" />
            <polygon points="175,190 200,175 225,190 225,215 200,230 175,215" fill="none" />
            <polygon points="125,175 150,160 175,175 175,200 150,215 125,200" fill="none" />
            <polygon points="225,190 250,175 275,190 275,215 250,230 225,215" fill="none" />
          </g>
          <g>
            <rect x="182" y="120" width="36" height="30" fill="#8a8f99" />
            <polygon points="180,120 200,104 220,120" fill="#6b7280" />
            <rect x="176" y="112" width="6" height="10" fill="#8a8f99" />
            <rect x="218" y="112" width="6" height="10" fill="#8a8f99" />
            <rect x="196" y="132" width="8" height="18" fill="#4b3a2a" />
          </g>
          <g opacity="0.85">
            <rect x="130" y="163" width="18" height="14" fill="#a9895f" />
            <polygon points="128,163 139,154 150,163" fill="#7a5b3a" />
            <rect x="245" y="166" width="16" height="13" fill="#a9895f" />
            <polygon points="243,166 253,157 263,166" fill="#7a5b3a" />
            <rect x="160" y="182" width="16" height="13" fill="#a9895f" />
            <polygon points="158,182 168,173 178,182" fill="#7a5b3a" />
          </g>
        </svg>
      </div>
      <div id="title-screen-content">
        <h1 id="title-heading">For Glory</h1>
        <button id="title-start" type="button">Start</button>
      </div>
    </div>

    <div id="countdown-overlay">
      <div id="countdown-timer-fly"></div>
      <div id="countdown-word"></div>
    </div>

    <div id="victory-overlay">
      <button id="victory-exit" type="button">Exit</button>
      <div id="victory-numbers">
        <div id="victory-num-left" class="victory-num">0</div>
        <div id="victory-num-right" class="victory-num">0</div>
      </div>
      <div id="victory-text"></div>
    </div>

    <div id="fade-overlay"></div>

    <button id="platform-toggle" type="button"></button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
